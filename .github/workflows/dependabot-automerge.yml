# Automatically merge Dependabot PRs when the version bump is inside the range
# configured in .github/auto-merge.yml

name: Auto-Merge Dependabot PRs

on:
    # WARNING: this runs in the context of the PR base, so it must not build untrusted code
    pull_request_target:
        types: [opened, synchronize, reopened]

jobs:
    auto-merge:
        runs-on: ubuntu-latest
        # only Dependabot's own pull requests
        if: github.actor == 'dependabot[bot]'

        permissions:
            contents: write
            pull-requests: write

        steps:
            - name: Auto-merge Dependabot PRs
              uses: iobroker-bot-orga/action-automerge-dependabot@v1
              with:
                  github-token: ${{ secrets.GITHUB_TOKEN }}
