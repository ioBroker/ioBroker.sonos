# Dependabot configuration
# Cooldown delays updating normal npm dependencies by 7 days but allows security updates to be processed immediately.
# Note: Cooldown is not supported for the github-actions ecosystem.
# Reference: https://docs.github.com/en/code-security/reference/supply-chain-security/dependabot-options-reference
version: 2
updates:

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'cron'
      timezone: 'Europe/Berlin'
      cronjob: '11 2 18 * *'
    open-pull-requests-limit: 15

  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'cron'
      timezone: 'Europe/Berlin'
      cronjob: '11 2 18 * *'
    open-pull-requests-limit: 20
    versioning-strategy: 'increase'
    ignore:
      - dependency-name: '@types/node'
        update-types:
          - 'version-update:semver-major'
      # @svrooij/sonos depends on exactly 3.19.0 and calls the v3 top-level parse(),
      # which v4 replaced with the XMLParser class. Raising it breaks that library, so
      # the update cannot be applied here - see the overrides entry in package.json.
      - dependency-name: 'fast-xml-parser'
    cooldown:
      default-days: 7
