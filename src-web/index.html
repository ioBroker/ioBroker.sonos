<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, viewport-fit=cover"
        />
        <meta
            name="theme-color"
            content="#e31c23"
        />
        <link
            rel="icon"
            type="image/png"
            href="./favicon.png"
        />
        <script type="text/javascript" src="_socket/info.js"></script>
        <script>
            const script = document.createElement('script');
            window.registerSocketOnLoad = function (cb) {
                window.socketLoadedHandler = cb;
            };
            script.onload = function () {
                typeof window.socketLoadedHandler === 'function' && window.socketLoadedHandler();
            };

            script.src =
                window.location.port.startsWith('300')
                    ? `${window.location.protocol}//${window.location.hostname}:8082/lib/js/socket.io.js`
                    : '../../lib/js/socket.io.js';

            document.head.appendChild(script);
        </script>
        <title>SONOS</title>
        <style>
            html,
            body,
            #root {
                height: 100%;
            }
            body {
                margin: 0;
            }
        </style>
    </head>
    <body>
        <div id="root"></div>
        <script
            type="module"
            src="/src/index.tsx"
        ></script>
    </body>
</html>
